            <tspan x="95" dy="20">22</tspan>
        </text>

        <!-- Java Code -->
        <text x="120" y="100" fill="#F8F8F2">
            <tspan x="120" dy="0"><tspan fill="#FF79C6">public class</tspan> <tspan fill="#8BE9FD">Workspace</tspan> {</tspan>
            <tspan x="120" dy="20"></tspan>
            <tspan x="150" dy="20"><tspan fill="#FF79C6">private static final</tspan> <tspan fill="#8BE9FD">String</tspan> NAME = <tspan fill="#F1FA8C">"Smruti Ranjan Nayak"</tspan>;</tspan>
            <tspan x="150" dy="20"><tspan fill="#FF79C6">private static final</tspan> <tspan fill="#8BE9FD">String</tspan> ROLE = <tspan fill="#F1FA8C">"Java and AI Developer"</tspan>;</tspan>
            <tspan x="150" dy="20"><tspan fill="#FF79C6">private static final</tspan> <tspan fill="#8BE9FD">String</tspan> COLLEGE = <tspan fill="#F1FA8C">"GIET University, B.Tech CSE"</tspan>;</tspan>
            <tspan x="120" dy="20"></tspan>
            <tspan x="150" dy="20"><tspan fill="#FF79C6">private static final</tspan> <tspan fill="#8BE9FD">String</tspan>[] SKILLS = {</tspan>
            <tspan x="180" dy="20"><tspan fill="#F1FA8C">"Java"</tspan>, <tspan fill="#F1FA8C">"Python"</tspan>, <tspan fill="#F1FA8C">"C"</tspan>, <tspan fill="#F1FA8C">"SQL"</tspan>, <tspan fill="#F1FA8C">"HTML"</tspan>, <tspan fill="#F1FA8C">"CSS"</tspan>, <tspan fill="#F1FA8C">"JavaScript"</tspan>,</tspan>
            <tspan x="180" dy="20"><tspan fill="#F1FA8C">"React.js"</tspan>, <tspan fill="#F1FA8C">"Node.js"</tspan>, <tspan fill="#F1FA8C">"Tailwind CSS"</tspan>, <tspan fill="#F1FA8C">"Spring Boot"</tspan>, <tspan fill="#F1FA8C">"Spring AI"</tspan>,</tspan>
            <tspan x="180" dy="20"><tspan fill="#F1FA8C">"Hibernate"</tspan>, <tspan fill="#F1FA8C">"Servlet"</tspan>, <tspan fill="#F1FA8C">"JDBC"</tspan>, <tspan fill="#F1FA8C">"NumPy"</tspan>, <tspan fill="#F1FA8C">"Pandas"</tspan>,</tspan>
            <tspan x="180" dy="20"><tspan fill="#F1FA8C">"scikit-learn"</tspan>, <tspan fill="#F1FA8C">"OpenCV"</tspan>, <tspan fill="#F1FA8C">"Matplotlib"</tspan>, <tspan fill="#F1FA8C">"MySQL"</tspan>, <tspan fill="#F1FA8C">"PostgreSQL"</tspan>,</tspan>
            <tspan x="180" dy="20"><tspan fill="#F1FA8C">"MongoDB"</tspan>, <tspan fill="#F1FA8C">"Git"</tspan>, <tspan fill="#F1FA8C">"GitHub"</tspan>, <tspan fill="#F1FA8C">"Postman"</tspan>, <tspan fill="#F1FA8C">"Power BI"</tspan>, <tspan fill="#F1FA8C">"n8n"</tspan>, <tspan fill="#F1FA8C">"Gemini"</tspan></tspan>
            <tspan x="150" dy="20">};</tspan>
            <tspan x="120" dy="20"></tspan>
            <tspan x="150" dy="20"><tspan fill="#FF79C6">public static void</tspan> <tspan fill="#50FA7B">main</tspan>(<tspan fill="#8BE9FD">String</tspan>[] args) {</tspan>
            <tspan x="180" dy="20"><tspan fill="#8BE9FD">System</tspan>.out.<tspan fill="#50FA7B">println</tspan>(<tspan fill="#F1FA8C">"Hi, I'm "</tspan> + NAME + <tspan fill="#F1FA8C">", "</tspan> + ROLE + <tspan fill="#F1FA8C">"."</tspan>);</tspan>
            <tspan x="180" dy="20"><tspan fill="#8BE9FD">System</tspan>.out.<tspan fill="#50FA7B">println</tspan>(<tspan fill="#F1FA8C">"Studying at "</tspan> + COLLEGE);</tspan>
            <tspan x="180" dy="20"><tspan fill="#FF79C6">for</tspan> (<tspan fill="#8BE9FD">String</tspan> skill : SKILLS) {</tspan>
            <tspan x="210" dy="20"><tspan fill="#8BE9FD">System</tspan>.out.<tspan fill="#50FA7B">println</tspan>(<tspan fill="#F1FA8C">" - "</tspan> + skill);</tspan>
            <tspan x="180" dy="20">}</tspan>
            <tspan x="150" dy="20">}</tspan>
            <tspan x="120" dy="20">}</tspan>
        </text>
    </g>

