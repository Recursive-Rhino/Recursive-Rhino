            <stop offset="100%" stop-color="#121212" />
        </linearGradient>
        <filter id="shadow">
            <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
        </filter>
    </defs>

    <!-- Desktop Background -->
